<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم | أحمد</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* ============================================
       Self-contained styling — this page never depends on
       style.css/admin.css loading correctly. Everything it needs
       to look identical to the real dashboard login is right here.
       ============================================ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Oxygen, Ubuntu, sans-serif;
      background: #08080e;
      color: #e2e8f0;
      line-height: 1.7;
      min-height: 100vh;
    }
    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .admin-body {
      padding-top: 0;
      background: #05050a;
      min-height: 100vh;
    }

    /* ===== NAVBAR ===== */
    .admin-navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(8, 8, 14, 0.96);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .admin-nav-container {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
    }
    .admin-nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 700;
    }
    .admin-nav-brand i { color: #f59e0b; font-size: 1.3rem; }
    .admin-nav-links { display: flex; align-items: center; gap: 8px; }
    .admin-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }
    .admin-nav-btn:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.04);
    }
    .logout-btn:hover {
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
      background: rgba(239, 68, 68, 0.06);
    }

    /* ===== LOCK SCREEN ===== */
    .lock-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #05050a;
      padding: 20px;
    }
    .lock-card {
      width: 100%;
      max-width: 400px;
      padding: 48px 36px 40px;
      text-align: center;
      background: rgba(12, 12, 20, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
      overflow: hidden;
    }
    .lock-avatar { position: relative; width: 88px; height: 88px; margin: 0 auto 20px; }
    .lock-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      position: relative;
      z-index: 1;
    }
    .lock-avatar-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid rgba(99, 102, 241, 0.3);
      animation: lockRingPulse 2.5s ease-in-out infinite;
    }
    @keyframes lockRingPulse {
      0%, 100% { border-color: rgba(99, 102, 241, 0.3); transform: scale(1); }
      50% { border-color: rgba(99, 102, 241, 0.6); transform: scale(1.05); }
    }
    .lock-title { font-size: 1.35rem; font-weight: 700; color: #ffffff; margin-bottom: 6px; letter-spacing: -0.3px; }
    .lock-subtitle { font-size: 0.85rem; color: #64748b; margin-bottom: 28px; }
    .lock-form { text-align: right; }
    .lock-input-group { position: relative; margin-bottom: 14px; }
    .lock-input-group i {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #475569;
      font-size: 0.9rem;
      z-index: 1;
      transition: color 0.2s;
    }
    .lock-input-group:focus-within i { color: #818cf8; }
    .lock-input-group input {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 15px 46px 15px 16px;
      color: #ffffff;
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
    }
    .lock-input-group input::placeholder { color: #334155; }
    .lock-input-group input:focus {
      border-color: rgba(99, 102, 241, 0.3);
      background: rgba(0, 0, 0, 0.5);
      box-shadow: 0 0 0 1px rgba(99, 102, 241, 0.1);
    }
    .lock-input-group input[type="password"] { direction: ltr; text-align: right; }
    .lock-input-group input[type="password"]::placeholder { text-align: right; direction: rtl; }
    .lock-error {
      color: #ef4444;
      font-size: 0.78rem;
      margin-bottom: 16px;
      display: none;
      text-align: center;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.12);
      padding: 8px 12px;
      border-radius: 8px;
    }
    .lock-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 24px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
      margin-top: 4px;
    }
    .lock-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .lock-btn span, .lock-btn i { position: relative; z-index: 1; }
    .lock-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(99, 102, 241, 0.3); }
    .lock-btn:hover::before { opacity: 1; }
    .lock-btn:active { transform: translateY(0); }
  </style>
</head>
<body class="rtl admin-body">

  <!-- ===== ADMIN NAVBAR (identical to the real dashboard) ===== -->
  <nav class="admin-navbar">
    <div class="admin-nav-container">
      <div class="admin-nav-brand">
        <i class="fas fa-crown"></i>
        <span>لوحة التحكم</span>
      </div>
      <div class="admin-nav-links">
        <a href="index.html" class="admin-nav-btn" title="الموقع الرئيسي">
          <i class="fas fa-external-link-alt"></i>
          <span>الموقع</span>
        </a>
        <button class="admin-nav-btn logout-btn" title="تسجيل الخروج">
          <i class="fas fa-sign-out-alt"></i>
          <span>خروج</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- ===== LOCK SCREEN (identical markup/classes to the real one) ===== -->
  <div class="lock-screen" id="lockScreen">
    <div class="lock-card glass-card">
      <div class="lock-avatar">
        <img src="ahmed.jpeg" alt="أحمد" />
        <div class="lock-avatar-ring"></div>
      </div>
      <h2 class="lock-title">مرحباً بعودتك</h2>
      <p class="lock-subtitle">سجل الدخول للوحة التحكم</p>
      <div class="lock-form">
        <div class="lock-input-group">
          <i class="fas fa-user"></i>
          <input type="text" id="usernameInput" placeholder="اسم المستخدم" autocomplete="off" />
        </div>
        <div class="lock-input-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="passwordInput" placeholder="كلمة المرور" autocomplete="off" />
        </div>
        <p class="lock-error" id="lockError">اسم المستخدم أو كلمة المرور غير صحيحة</p>
        <button id="unlockBtn" class="lock-btn">
          <span>تسجيل الدخول</span>
          <i class="fas fa-arrow-left"></i>
        </button>
      </div>
    </div>
  </div>

  <script src="security.js"></script>
  <script src="trap.js"></script>
</body>
</html>
